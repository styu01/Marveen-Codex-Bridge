name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - name: Test
        env:
          MARVEEN_CODEX_BRIDGE_BETTER_SQLITE3_PATH: ${{ github.workspace }}/node_modules/better-sqlite3
        run: npm test
